<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ゆるパカ 認証テスト</title>
<link rel="stylesheet" href="assets/yurupaka-admin.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/supabase-config.js"></script>
<style>.debug-box{white-space:pre-wrap;word-break:break-word;background:#fff;border:1px solid #ddd;border-radius:8px;padding:16px;line-height:1.7}.ok{color:#087f5b}.bad{color:#c92a2a}</style>
</head>
<body>
<main class="section"><div class="wrap">
<p class="eyebrow">AUTH TEST</p>
<h1>ログイン確認ページ</h1>
<p>このページは管理画面本体を触らず、Googleログインが成立しているかだけ確認します。</p>
<div class="card form-grid">
<button type="button" id="login">Googleでログイン</button>
<button type="button" id="logout">ログアウト</button>
<a href="admin.html">管理ページへ戻る</a>
</div>
<h2>診断結果</h2>
<div id="out" class="debug-box">起動中...</div>
</div></main>
<script>
const out = document.getElementById('out');
const cfg = window.YURUPAKA_SUPABASE || {};
let sb = null;
function write(lines){ out.textContent = Array.isArray(lines) ? lines.join('\\n') : String(lines); }
function decodeJwtPayload(token){
  try{
    const part = String(token || '').split('.')[1];
    if(!part) return null;
    const b64 = part.replace(/-/g,'+').replace(/_/g,'/').padEnd(Math.ceil(part.length/4)*4,'=');
    const binary = atob(b64);
    const bytes = new Uint8Array(binary.length);
    for(let i=0;i<binary.length;i++) bytes[i]=binary.charCodeAt(i);
    return JSON.parse(new TextDecoder('utf-8').decode(bytes));
  }catch(e){ return { decode_error:e.message }; }
}
async function run(){
  const lines=[];
  lines.push('テスト版: 20260523-auth-test');
  lines.push('URL: ' + location.origin + location.pathname + location.search + (location.hash ? '#...' : ''));
  lines.push('Supabase設定: ' + ((cfg.url && cfg.anonKey) ? 'あり' : 'なし'));
  lines.push('Supabaseライブラリ: ' + (window.supabase ? 'あり' : 'なし'));
  if(!cfg.url || !cfg.anonKey || !window.supabase){ write(lines); return; }
  sb = window.supabase.createClient(cfg.url, cfg.anonKey);
  const hash = new URLSearchParams(String(location.hash || '').replace(/^#/, ''));
  const access = hash.get('access_token');
  const refresh = hash.get('refresh_token');
  lines.push('hash access_token: ' + (access ? 'あり' : 'なし'));
  if(access){
    const payload = decodeJwtPayload(access);
    lines.push('JWT読取: ' + (payload && !payload.decode_error ? 'OK' : 'NG'));
    lines.push('JWT email: ' + (payload?.email || 'なし'));
    lines.push('JWT exp: ' + (payload?.exp ? new Date(payload.exp*1000).toLocaleString('ja-JP') : 'なし'));
    if(refresh){
      try{
        lines.push('setSession: 実行中...');
        write(lines);
        const r = await Promise.race([
          sb.auth.setSession({access_token:access, refresh_token:refresh}),
          new Promise((_,reject)=>setTimeout(()=>reject(new Error('setSession timeout 8s')),8000))
        ]);
        lines.push('setSession: ' + (r.error ? 'NG ' + r.error.message : 'OK'));
        if(!r.error) history.replaceState(null,'',location.origin+location.pathname);
      }catch(e){ lines.push('setSession: NG ' + e.message); }
    }
  }
  try{
    const s = await sb.auth.getSession();
    lines.push('getSession user: ' + (s.data?.session?.user?.email || 'なし'));
  }catch(e){ lines.push('getSession error: ' + e.message); }
  try{
    const n = await sb.from('news_posts').select('id,title').limit(3);
    lines.push('news_posts読込: ' + (n.error ? 'NG ' + n.error.message : 'OK ' + (n.data?.length || 0) + '件'));
  }catch(e){ lines.push('news_posts例外: ' + e.message); }
  write(lines);
}
document.getElementById('login').addEventListener('click', async()=>{
  if(!sb) sb = window.supabase.createClient(cfg.url, cfg.anonKey);
  const r = await sb.auth.signInWithOAuth({provider:'google', options:{redirectTo: location.origin + location.pathname}});
  if(r.error) write('Googleログインエラー: '+r.error.message);
});
document.getElementById('logout').addEventListener('click', async()=>{ if(sb) await sb.auth.signOut(); location.href=location.origin+location.pathname; });
run();
</script>
</body>
</html>
